<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechGear - Crear producto</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #38bdf8;
        }

        .nav-title {
            color: #d1d5db;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #111827;
        }

        .descripcion-pagina {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #38bdf8;
        }

        .boton {
            width: 100%;
            padding: 13px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton:hover {
            background: #0369a1;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0284c7;
            text-decoration: none;
        }

        .mensaje {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        footer {
            background: #111827;
            color: #9ca3af;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 25px;
            }

            .nav-title {
                display: none;
            }

            .container {
                width: 92%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            TechGear
        </div>

        <div class="nav-title">
            Crear producto
        </div>
    </nav>


    <main class="container">

        <h1>Agregar producto</h1>

        <p class="descripcion-pagina">
            Registra un nuevo producto en el catálogo de TechGear.
        </p>


        {% if mensaje %}
            <div class="mensaje">
                {{ mensaje }}
            </div>
        {% endif %}


        {% if error %}
            <div class="error">
                ⚠️ {{ error }}
            </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="campo">
                <label for="nombre">Nombre del producto</label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej. Mouse Logitech G203"
                    required
                >
            </div>


            <div class="campo">
                <label for="descripcion">Descripción</label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    placeholder="Describe las características del producto"
                    required
                ></textarea>
            </div>


            <div class="campo">
                <label for="precio">Precio</label>

                <input
                    type="number"
                    id="precio"
                    name="precio"
                    min="1"
                    step="0.01"
                    placeholder="Ej. 89900"
                    required
                >
            </div>


            <div class="campo">
                <label for="stock">Stock</label>

                <input
                    type="number"
                    id="stock"
                    name="stock"
                    min="0"
                    placeholder="Ej. 15"
                    required
                >
            </div>


            <div class="campo">
                <label for="categoria">Categoría</label>

                <input
                    type="text"
                    id="categoria"
                    name="categoria"
                    placeholder="Ej. Periféricos"
                    required
                >
            </div>


            <button type="submit" class="boton">
                Crear producto
            </button>

        </form>


        <a href="{% url 'productos' %}" class="volver">
            ← Volver al catálogo
        </a>

    </main>


    <footer>
        © 2026 TechGear — Catálogo de productos
    </footer>

</body>

</html>
